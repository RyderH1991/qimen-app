<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇門引路｜桌遊解盤</title>
<style>

  :root{
    --bg: #07070a;
    --surface: #131319;
    --surface-2: #1a1a22;
    --ink: #ece5d3;
    --ink-dim: #8a8577;
    --ink-faint: #4d4a42;
    --gold: #b7924a;
    --gold-hi: #e6c878;
    --gold-dim: #4a3d1f;
    --red: #b23b2e;
    --orange: #e0642a;
    --cyan: #6fadbe;
    --line: #262631;
    --halo-color: #b7924a;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -6%, rgba(183,146,74,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 1200px 800px at 50% 110%, #101018 0%, var(--bg) 55%),
      var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 22px 90px;
  }

  /* ---------- Login bar ---------- */
  .login-bar{
    display:flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 30px;
    font-size: 12.5px;
    color: var(--ink-dim);
  }
  .login-bar .user-info{
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .login-bar img.avatar{
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
  }
  .btn-line{
    display:inline-flex;
    align-items:center;
    gap: 7px;
    background: #06C755;
    color: #fff;
    border: none;
    padding: 9px 20px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    font-family: inherit;
    transition: filter 0.15s ease;
  }
  .btn-line:hover{ filter: brightness(1.08); }
  .btn-logout{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.05em;
  }
  .btn-logout:hover{ border-color: var(--gold-dim); color: var(--gold); }

  .btn-topup{
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.05em;
  }
  .btn-topup:hover{ background: rgba(183,146,74,0.1); }

  .topup-panel{
    max-width: 420px;
    margin: -14px auto 30px;
    display: none;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .topup-panel.show{ display:flex; }
  .topup-panel a{
    display:block;
    text-decoration:none;
    background: var(--surface);
    border: 1px solid var(--gold-dim);
    border-radius: 10px;
    padding: 12px 18px;
    text-align:center;
    color: var(--ink);
    font-size: 12.5px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .topup-panel a:hover{ border-color: var(--gold); background: rgba(183,146,74,0.08); }
  .topup-panel a .pts{
    display:block;
    font-family: "Noto Serif TC", serif;
    font-size: 18px;
    color: var(--gold-hi);
    margin-bottom: 4px;
  }
  .topup-panel a .price{ color: var(--ink-dim); font-size: 11px; }

  .history-panel{
    max-width: 560px;
    margin: -14px auto 30px;
    display: none;
    text-align: left;
  }
  .history-panel.show{ display:block; }
  .history-list{
    max-height: 360px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 4px;
  }
  .history-item{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .history-item .h-top{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 6px;
  }
  .history-item .h-q{
    font-size: 12.5px;
    color: var(--gold-hi);
    font-family: "Noto Serif TC", serif;
  }
  .history-item .h-meta{
    font-size: 10.5px;
    color: var(--ink-faint);
    margin-bottom: 8px;
  }
  .history-item .h-text{
    font-size: 12px;
    line-height: 1.8;
    color: var(--ink);
    white-space: pre-wrap;
  }
  .history-item .h-del{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-faint);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 10.5px;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }
  .history-item .h-del:hover{ border-color: var(--red); color: var(--red); }
  .history-empty{
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
    padding: 20px 0;
  }

  /* ---------- Header ---------- */
  header{ text-align:center; margin-bottom: 40px; }
  .eyebrow{
    letter-spacing: 0.55em;
    font-size: 10.5px;
    color: var(--gold);
    text-transform: uppercase;
    margin: 0 0 16px;
    opacity: 0.85;
  }
  .rule{
    width: 40px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 18px;
  }
  h1{
    font-family: "Noto Serif TC", "Songti TC", serif;
    font-weight: 600;
    font-size: clamp(26px, 6vw, 36px);
    margin: 0 0 10px;
    letter-spacing: 0.18em;
    color: var(--ink);
  }
  h1 em{
    font-style: normal;
    color: var(--gold-hi);
  }
  .sub{
    color: var(--ink-dim);
    font-size: 13px;
    letter-spacing: 0.12em;
  }

  /* ---------- Question ---------- */
  .question-box{
    margin: 34px auto 34px;
    max-width: 480px;
    position: relative;
  }
  .question-box input{
    width:100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 10px 4px 12px;
    color: var(--ink);
    font-size: 14.5px;
    font-family: "Noto Serif TC", serif;
    letter-spacing: 0.05em;
    text-align: center;
    transition: border-color 0.2s ease;
  }
  .question-box input::placeholder{ color: var(--ink-faint); }
  .question-box input:focus{ outline: none; border-color: var(--gold-dim); }

  /* ---------- Mode toggle ---------- */
  .mode-toggle{
    display:flex;
    justify-content:center;
    gap: 0;
    margin-bottom: 28px;
  }
  .mode-toggle button{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.15em;
    padding: 9px 22px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .mode-toggle button:first-child{ border-radius: 999px 0 0 999px; border-right:none; }
  .mode-toggle button:last-child{ border-radius: 0 999px 999px 0; }
  .mode-toggle button.active{
    color: var(--gold-hi);
    border-color: var(--gold-dim);
    background: rgba(183,146,74,0.08);
  }

  /* ---------- Dice ---------- */
  .dice-row{
    display:flex;
    justify-content:center;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: nowrap;
    width: 100%;
  }
  .die{
    flex: 1 1 0;
    min-width: 0;
    max-width: 54px;
    height: 64px;
    border: 1px solid var(--gold-dim);
    border-radius: 14px;
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(16px, 5.5vw, 22px);
    font-weight: 500;
    font-family: "Noto Serif TC", serif;
    color: var(--gold);
    position: relative;
    box-shadow: inset 0 0 14px rgba(183,146,74,0.06);
  }
  .die::before{
    content:'';
    position:absolute; inset: 4px;
    border: 1px solid rgba(183,146,74,0.18);
    border-radius: 9px;
    pointer-events: none;
  }
  .die::after{
    content: attr(data-label);
    position:absolute;
    bottom: -19px;
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.15em;
  }
  .die.default-char{ color: var(--ink-faint); font-size: 18px; }
  .die.rolling{ animation: shake 0.08s infinite; color: var(--ink-dim); }
  @keyframes shake{
    0%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-2px) rotate(-2deg); }
    100%{ transform: translateY(1px) rotate(2deg); }
  }

  .die-input{
    flex: 1 1 0;
    min-width: 0;
    max-width: 54px;
    height: 64px;
    border: 1px solid var(--gold-dim);
    border-radius: 14px;
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    color: var(--gold-hi);
    font-size: clamp(16px, 5.5vw, 24px);
    font-family: "Noto Serif TC", serif;
    text-align: center;
    -moz-appearance: textfield;
  }
  .die-input::-webkit-outer-spin-button,
  .die-input::-webkit-inner-spin-button{ -webkit-appearance: none; margin:0; }
  .die-input:focus{ outline:none; border-color: var(--gold); }

  /* ---------- Buttons ---------- */
  .action-wrap{ text-align:center; margin-bottom: 8px; }
  .btn-gold{
    position: relative;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 70%);
    color: #14120a;
    border: none;
    width: 100%;
    max-width: 374px;
    padding: 15px 0;
    border-radius: 18px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.35em;
    cursor: pointer;
    font-family: "Noto Serif TC", serif;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 4px 18px rgba(183,146,74,0.25);
  }
  .btn-gold:hover{ transform: translateY(-1px); box-shadow: 0 6px 22px rgba(183,146,74,0.35); }
  .btn-gold:active{ transform: translateY(0); }
  .btn-gold:disabled{ opacity: 0.45; cursor: default; transform:none; box-shadow:none; }

  .reroll-note{
    text-align:center;
    font-size: 11.5px;
    color: var(--red);
    min-height: 18px;
    margin: 12px 0 0;
    letter-spacing: 0.08em;
  }

  /* ---------- Result ---------- */
  .result-area{ margin-top: 58px; display:none; }
  .result-area.show{ display:block; }

  .palace-gua-top{
    text-align:center;
    font-size: 34px;
    margin-bottom: 14px;
    color: var(--halo-color);
    text-shadow: 0 0 18px var(--halo-color);
    transition: color 0.3s ease;
  }

  .palace-frame-outer{
    width: 240px;
    height: 240px;
    margin: 0 auto;
    padding: 3px;
    border-radius: 4px;
    box-shadow: 0 0 36px 6px var(--halo-color);
    transition: box-shadow 0.3s ease;
  }
  .palace-frame{
    width: 100%;
    height: 100%;
    padding: 24px;
    background: var(--surface);
    border: 1px solid var(--halo-color);
    box-shadow: inset 0 0 30px var(--halo-color);
    position: relative;
    display: flex;
    align-items: center;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .palace-grid{
    width: 100%;
    display:grid;
    grid-template-columns: 1fr 1fr;
    row-gap: 16px;
    position: relative;
  }
  .cell{
    font-family: "Noto Serif TC", serif;
    font-size: 21px;
    text-align:center;
    color: var(--ink);
    letter-spacing: 0.05em;
  }
  .cell.shen{ grid-column: 1 / 3; font-size: 26px; color: var(--ink); letter-spacing: 0.3em; }
  .cell .val{ position:relative; display:inline-block; }
  .cell .empty-circle{
    display:inline-block;
    width: 30px; height: 30px;
    border: 2.5px solid currentColor;
    border-radius: 50%;
  }
  .cell.red .val{ color: var(--red); }
  .cell.orange .val{ color: var(--orange); }
  .cell.cyan .val{ color: var(--cyan); }

  .palace-name-bottom{
    text-align:center;
    margin-top: 16px;
    font-family: "Noto Serif TC", serif;
    font-size: 15px;
    letter-spacing: 0.5em;
    padding-left: 0.5em;
    color: var(--halo-color);
    text-shadow: 0 0 14px var(--halo-color);
    transition: color 0.3s ease;
  }

  .pan-summary{
    max-width: 460px;
    margin: 26px auto 0;
    text-align:center;
    font-size: 13px;
    line-height: 2;
    color: var(--ink-dim);
    letter-spacing: 0.06em;
    border-top: 1px solid var(--line);
    padding-top: 18px;
  }
  .pan-summary .label{ color: var(--ink-faint); font-size: 10.5px; letter-spacing: 0.3em; margin-bottom: 6px; display:block; }
  .pan-summary .line{ color: var(--ink); }

  .harm-tags{
    margin: 18px auto 0;
    max-width: 280px;
    display:flex;
    flex-wrap: wrap;
    gap: 7px;
    justify-content: center;
  }
  .tag{
    font-size: 10.5px;
    padding: 4px 12px;
    border-radius: 999px;
    letter-spacing: 0.08em;
    border: 1px solid var(--line);
    color: var(--ink-dim);
  }
  .tag.red{ color: var(--red); border-color: rgba(178,59,46,0.45); }
  .tag.orange{ color: var(--orange); border-color: rgba(201,138,59,0.45); }
  .tag.cyan{ color: var(--cyan); border-color: rgba(111,173,190,0.45); }

  .interpret-btn-wrap{ text-align:center; margin-top: 34px; }
  .interpret-btn{
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    padding: 12px 30px;
    border-radius: 999px;
    font-size: 12.5px;
    letter-spacing: 0.2em;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  .interpret-btn:hover{ background: rgba(183,146,74,0.08); border-color: var(--gold); }

  .interpret-box{
    margin: 22px auto 0;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 22px 24px;
    font-size: 13.5px;
    line-height: 1.95;
    color: var(--ink);
    display:none;
    white-space: pre-wrap;
  }
  .interpret-box.show{ display:block; }

  footer{
    text-align:center;
    margin-top: 70px;
    font-size: 10.5px;
    color: var(--ink-faint);
    letter-spacing: 0.25em;
  }

  .legend{
    max-width: 520px;
    margin: 46px auto 0;
    font-size: 11px;
    color: var(--ink-faint);
    display:flex;
    justify-content:center;
    gap: 20px;
    flex-wrap: wrap;
    letter-spacing: 0.03em;
  }
  .legend span{ display:inline-flex; align-items:center; gap: 6px; }
  .swatch{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .site-footer{margin-top:40px;padding:28px 16px 24px;border-top:1px solid #3a322b;text-align:center;color:#8a8780;font-size:14px}
.site-footer a{color:#9a9790;text-decoration:none;transition:color .2s}
.site-footer a:hover{color:#cfcac0}
.sf-icons{display:flex;justify-content:center;gap:16px;margin-bottom:22px}
.sf-icons a{display:inline-flex;width:38px;height:38px;border:1px solid #4a4540;border-radius:50%;align-items:center;justify-content:center}
.sf-icons svg{width:20px;height:20px;fill:none;stroke:#9a9790;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sf-icons a:hover{border-color:#8a8780}
.sf-links{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 34px;margin-bottom:20px}
.sf-copy{font-size:12px;color:#6d6b66}
.ad-banner{max-width:760px;margin:40px auto 0;padding:0 16px}
.ad-banner a{display:block}
.ad-banner img{width:100%;height:auto;display:block;border-radius:10px;border:1px solid #3a322b}  

  /* ---------- 桌遊模式專用 ---------- */
  .mode-switch{ text-align:center; margin-bottom:22px; font-size:12px; letter-spacing:0.12em; }
  .mode-switch a{ color:var(--ink-dim); text-decoration:none; border:1px solid var(--line); padding:7px 18px; border-radius:999px; }
  .mode-switch a:hover{ border-color:var(--gold-dim); color:var(--gold); }
  .mode-switch a.on{ color:var(--gold-hi); border-color:var(--gold-dim); background:rgba(183,146,74,0.08); }
  .card-form{ max-width:520px; margin:0 auto 26px; display:flex; flex-direction:column; gap:10px; }
  .card-row{ display:grid; grid-template-columns: 78px 64px 1fr; gap:8px; align-items:center; }
  .card-row .lab{ font-size:12.5px; color:var(--ink-dim); letter-spacing:0.12em; text-align:right; }
  .card-row .lab small{ display:block; font-size:10px; color:var(--ink-faint); letter-spacing:0.05em; }
  .card-row input, .card-row select{
    background: var(--surface); color: var(--gold-hi); border:1px solid var(--gold-dim); border-radius:10px;
    padding: 10px 8px; font-size:14px; font-family: inherit; width:100%; min-width:0;
  }
  .card-row input{ text-align:center; -moz-appearance:textfield; }
  .card-row input::-webkit-outer-spin-button,.card-row input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .card-row input:focus, .card-row select:focus{ outline:none; border-color:var(--gold); }
  .card-row select option{ background:#131319; color:#ece5d3; }
  .card-row.bad input{ border-color: var(--red); }
  .card-sep{ font-size:10.5px; color:var(--ink-faint); letter-spacing:0.3em; text-align:center; margin:8px 0 0; }
  .tag.gold{ color: var(--gold-hi); border-color: var(--gold-dim); }
  .tag.warn{ color: var(--orange); border-color: rgba(224,100,42,0.5); }
  .compare{ max-width:480px; margin:18px auto 0; font-size:12px; line-height:1.9; color:var(--ink-dim); text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 16px; display:none; }
  .compare.show{ display:block; }
  .compare b{ color: var(--ink); font-weight:500; }
  .extra-cards{ max-width:480px; margin:16px auto 0; font-size:12.5px; line-height:1.9; color:var(--ink-dim); text-align:center; }
  .extra-cards .line{ color:var(--ink); }
  .pan-summary .line{ display:block; }
  .hint{ font-size:11px; color:var(--ink-faint); text-align:center; margin:-8px 0 20px; letter-spacing:0.05em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="login-bar" id="loginBar">
    <button class="btn-line" id="lineLoginBtn">使用 LINE 登入</button>
  </div>

  <div class="topup-panel" id="topupPanel">
    <a href="/api/create-order?package=100"><span class="pts">100 點</span><span class="price">NT$100</span></a>
    <a href="/api/create-order?package=300"><span class="pts">300 點</span><span class="price">NT$270</span></a>
    <a href="/api/create-order?package=1000"><span class="pts">1000 點</span><span class="price">NT$800</span></a>
  </div>

  <div class="history-panel" id="historyPanel">
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="mode-switch">
    <a href="/">一般占卜</a>
    <a href="/game.html" class="on">桌遊解盤</a>
  </div>

  <header>
    <div class="eyebrow">QIMEN COMPASS</div>
    <div class="rule"></div>
    <h1>奇門引路 <em>桌遊解盤</em></h1>
    <div class="sub">填入終局的牌卡編號，還原你的一宮盤象</div>
  </header>

  <div class="question-box">
    <input id="questionInput" type="text" placeholder="想問什麼事？（例：這件事適合現在進行嗎）" />
  </div>

  <div class="hint">每一類可輸入牌上的編號，或直接從選單挑選牌名</div>

  <div class="card-form" id="cardForm"></div>

  <div class="action-wrap">
    <button class="btn-gold" id="actionBtn">起　盤</button>
  </div>
  <div class="reroll-note" id="rerollNote"></div>

  <div class="result-area" id="resultArea">
    <div class="palace-gua-top" id="palaceGuaTop"></div>
    <div class="palace-frame-outer" id="palaceFrameOuter">
      <div class="palace-frame" id="palaceFrame">
        <div class="palace-grid" id="palaceGrid"></div>
      </div>
    </div>
    <div class="palace-name-bottom" id="palaceName"></div>
    <div class="harm-tags" id="harmTags" style="max-width:420px"></div>
    <div class="compare" id="compareBox"></div>
    <div class="pan-summary" id="panSummary"></div>
    <div class="extra-cards" id="extraCards"></div>

    <div class="interpret-btn-wrap">
      <button class="interpret-btn" id="interpretBtn">AI 解盤（每次 10 點／新用戶送 5 次免費）</button>
    </div>
    <div class="interpret-box" id="interpretBox"></div>
  </div>

  <div class="legend">
    <span><span class="swatch" style="background:#b23b2e"></span>門迫</span>
    <span><span class="swatch" style="background:#e0642a"></span>擊刑</span>
    <span><span class="swatch" style="background:#6fadbe"></span>入墓</span>

<script src="/game-data.js"></script>
<script>
// ---------- 登入（與一般頁相同） ----------
const loginBar = document.getElementById('loginBar');
const STORE_KEY = 'qimen_game_pending';

function savePending(){
  try{
    const codes = {};
    CATS.forEach(c => { codes[c.key] = document.getElementById('num_'+c.key).value; });
    sessionStorage.setItem(STORE_KEY, JSON.stringify({ codes, question: document.getElementById('questionInput').value, shown: !!lastResult }));
  } catch(e){}
}
function restorePending(){
  let raw; try{ raw = sessionStorage.getItem(STORE_KEY); } catch(e){ return; }
  if(!raw) return;
  try{ sessionStorage.removeItem(STORE_KEY); } catch(e){}
  try{
    const s = JSON.parse(raw);
    if(s.question) document.getElementById('questionInput').value = s.question;
    CATS.forEach(c => {
      const v = s.codes && s.codes[c.key];
      if(v){ document.getElementById('num_'+c.key).value = v; syncFromNum(c.key); }
    });
    if(s.shown) buildChart();
  } catch(e){}
}
function renderLoggedOut(){
  loginBar.innerHTML = `<button class="btn-line" id="lineLoginBtn">使用 LINE 登入</button>`;
  document.getElementById('lineLoginBtn').addEventListener('click', () => { savePending(); window.location.href = '/api/line-login'; });
}
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML; }
function renderLoggedIn(user){
  const freeText = (user.freeUsesRemaining ?? 0) > 0 ? `　·　剩 ${user.freeUsesRemaining} 次免費` : '';
  loginBar.innerHTML = `
    <div class="user-info">
      ${user.pictureUrl ? `<img class="avatar" src="${escapeHtml(user.pictureUrl)}" alt="avatar">` : ''}
      <span>${escapeHtml(user.displayName || '已登入')}　·　${user.pointsBalance ?? 0} 點${freeText}</span>
    </div>
    <button class="btn-topup" id="topupBtn">儲值</button>
    <button class="btn-topup" id="historyBtn">歷史紀錄</button>
    <button class="btn-logout" id="logoutBtn">登出</button>`;
  document.getElementById('logoutBtn').addEventListener('click', async () => { await fetch('/api/logout', { method:'POST' }); window.location.href = '/game.html'; });
  document.getElementById('topupBtn').addEventListener('click', () => {
    document.getElementById('historyPanel').classList.remove('show');
    document.getElementById('topupPanel').classList.toggle('show');
  });
  document.getElementById('historyBtn').addEventListener('click', () => {
    document.getElementById('topupPanel').classList.remove('show');
    const p = document.getElementById('historyPanel');
    const show = !p.classList.contains('show');
    p.classList.toggle('show', show);
    if(show) loadHistory();
  });
}
async function loadHistory(){
  const listEl = document.getElementById('historyList');
  listEl.innerHTML = '<div class="history-empty">載入中...</div>';
  try{
    const resp = await fetch('/api/history'); const data = await resp.json();
    if(!resp.ok || !data.readings){ listEl.innerHTML = '<div class="history-empty">讀取歷史紀錄失敗</div>'; return; }
    if(!data.readings.length){ listEl.innerHTML = '<div class="history-empty">還沒有解盤紀錄</div>'; return; }
    listEl.innerHTML = data.readings.map(r => {
      const ds = new Date(r.created_at).toLocaleString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
      return `<div class="history-item" data-id="${r.id}">
        <div class="h-top"><span class="h-q">${escapeHtml(r.question || '（未輸入問題）')}</span><button class="h-del" data-id="${r.id}">刪除</button></div>
        <div class="h-meta">${ds}　·　${escapeHtml(r.palace)}宮・${escapeHtml(r.shen)}・${escapeHtml(r.star)}・${escapeHtml(r.door)}門</div>
        <div class="h-text">${escapeHtml(r.interpretation)}</div></div>`;
    }).join('');
    listEl.querySelectorAll('.h-del').forEach(btn => btn.addEventListener('click', async () => {
      btn.disabled = true; btn.textContent = '刪除中...';
      try{
        const r = await fetch('/api/history?id=' + encodeURIComponent(btn.dataset.id), { method:'DELETE' });
        if(r.ok){ listEl.querySelector(`.history-item[data-id="${btn.dataset.id}"]`)?.remove();
          if(!listEl.querySelector('.history-item')) listEl.innerHTML = '<div class="history-empty">還沒有解盤紀錄</div>';
        } else { btn.disabled = false; btn.textContent = '刪除'; }
      } catch(e){ btn.disabled = false; btn.textContent = '刪除'; }
    }));
  } catch(e){ listEl.innerHTML = '<div class="history-empty">連線發生問題</div>'; }
}
async function refreshLoginState(){
  try{ const r = await fetch('/api/me'); const d = await r.json(); d.loggedIn ? renderLoggedIn(d) : renderLoggedOut(); }
  catch(e){ renderLoggedOut(); }
}
refreshLoginState();

// ---------- 資料表（編號 = 骰子數字，與一般模式一致） ----------
const PALACE = {1:'坎',2:'坤',3:'震',4:'巽',6:'乾',7:'兌',8:'艮',9:'離'};
const SHEN   = {1:'值符',2:'螣蛇',3:'太陰',4:'六合',5:'白虎',6:'玄武',7:'九地',8:'九天'};
const STAR   = {1:'天蓬',2:'天芮',3:'天沖',4:'天輔',6:'天心',7:'天柱',8:'天任',9:'天英'};
const DOOR   = {1:'休',2:'死',3:'傷',4:'杜',6:'開',7:'驚',8:'生',9:'景'};
const GAN    = {0:'空無',1:'癸',2:'乙',3:'丙',4:'丁',5:'戊',6:'己',7:'庚',8:'辛',9:'壬'};

const palaceMeta = {
  坎:{halo:'#c7c9d1', gua:'☵'}, 坤:{halo:'#c99a3f', gua:'☷'}, 震:{halo:'#2f8f8a', gua:'☳'}, 巽:{halo:'#3f9d5c', gua:'☴'},
  乾:{halo:'#c7c9d1', gua:'☰'}, 兌:{halo:'#c0392b', gua:'☱'}, 艮:{halo:'#c7c9d1', gua:'☶'}, 離:{halo:'#9b7bc7', gua:'☲'}
};
// 真實奇門四害規則（與一般模式 index.html 相同，兩處要一起改）
const harmRules = {
  坎:{menpo:['生','死']},
  艮:{menpo:['傷','杜'], jixing:['庚'], rumu:['丁','己']},
  震:{menpo:['驚','開'], jixing:['戊']},
  巽:{menpo:['驚','開'], jixing:['壬','癸'], rumu:['辛']},
  離:{menpo:['休'], jixing:['辛']},
  坤:{menpo:['傷','杜'], jixing:['己'], rumu:['癸']},
  兌:{menpo:['景']},
  乾:{menpo:['景'], rumu:['乙','丙','戊']}
};

// ---------- 各類牌卡：編號 → 內容 ----------
function opts(map, fmt){ return Object.keys(map).map(Number).map(n => ({ code:n, label: fmt(n, map[n]) })); }
const stemOpts = [];
for(let n=0;n<=9;n++) stemOpts.push({ code:n, label:`${n}　${GAN[n]}` });
for(let n=1;n<=9;n++) stemOpts.push({ code:10+n, label:`${10+n}　${GAN[n]}・入墓` });
[1,5,6,7,8,9].forEach(n => stemOpts.push({ code:20+n, label:`${20+n}　${GAN[n]}・擊刑` }));
const doorOpts = opts(DOOR, (n,v)=>`${n}　${v}門`).concat(Object.keys(DOOR).map(Number).map(n => ({ code:30+n, label:`${30+n}　${DOOR[n]}門・門迫` })));

const CATS = [
    { key:'palace', name:'宮位', sub:'', opts: opts(PALACE,(n,v)=>`${n}　${v}宮`) },
  { key:'door',   name:'八門', sub:'', opts: doorOpts },
  { key:'star',   name:'九星', sub:'', opts: opts(STAR,(n,v)=>`${n}　${v}星`) },
  { key:'shen',   name:'八神', sub:'', opts: opts(SHEN,(n,v)=>`${n}　${v}`) },
  { key:'tian',   name:'天盤', sub:'', opts: stemOpts },
  { key:'di',     name:'地盤', sub:'', opts: stemOpts },
  { key:'guide',  name:'引導', sub:'', opts: GAME_GUIDE.map(g => ({ code:g.no, label:`${g.no}　${g.name}` })) },
  { key:'aware',  name:'覺察', sub:'', opts: GAME_AWARE.map(a => ({ code:a.no, label:`${a.no}　${a.topic}` })) },
  { key:'oracle', name:'神諭', sub:'', optional:true, opts: GAME_ORACLE.map((t,i) => ({ code:i+1, label:`${i+1}　${t}` })) }
];

const cardForm = document.getElementById('cardForm');
function buildForm(){
  cardForm.innerHTML = '';
  CATS.forEach((c, i) => {
    if(i === 6){ const s = document.createElement('div'); s.className = 'card-sep'; s.textContent = '· 引 導 與 覺 察 ·'; cardForm.appendChild(s); }
    const row = document.createElement('div');
    row.className = 'card-row'; row.id = 'row_'+c.key;
    row.innerHTML = `
      <div class="lab">${c.name}${c.sub ? `<small>${c.sub}</small>` : ''}</div>
      <input id="num_${c.key}" type="number" inputmode="numeric" placeholder="編號">
      <select id="sel_${c.key}"><option value="">請選擇</option>
        ${c.opts.map(o => `<option value="${o.code}">${o.label}</option>`).join('')}</select>`;
    cardForm.appendChild(row);
    row.querySelector('input').addEventListener('input', () => syncFromNum(c.key));
    row.querySelector('select').addEventListener('change', () => {
      document.getElementById('num_'+c.key).value = document.getElementById('sel_'+c.key).value;
      row.classList.remove('bad');
    });
  });
}
function syncFromNum(key){
  const c = CATS.find(x => x.key === key);
  const inp = document.getElementById('num_'+key), sel = document.getElementById('sel_'+key);
  const v = inp.value.trim();
  const ok = v !== '' && c.opts.some(o => String(o.code) === String(Number(v)));
  sel.value = ok ? String(Number(v)) : '';
  document.getElementById('row_'+key).classList.toggle('bad', v !== '' && !ok);
}
buildForm();

// ---------- 解析與比對 ----------
function parseStem(code){
  const state = code >= 20 ? 'jixing' : code >= 10 ? 'rumu' : 'normal';
  const n = code % 10;
  return { value: GAN[n], state, empty: n === 0 };
}

function compute(codes){
  const palace = PALACE[codes.palace];
  const door = DOOR[codes.door % 30];
  const doorCard = codes.door >= 31;
  const tian = parseStem(codes.tian), di = parseStem(codes.di);
  const rule = harmRules[palace] || {};
  const real = v => ({
    rumu: (rule.rumu || []).includes(v),
    jixing: (rule.jixing || []).includes(v)
  });
  const tReal = tian.empty ? {rumu:false,jixing:false} : real(tian.value);
  const dReal = di.empty ? {rumu:false,jixing:false} : real(di.value);
  const doorReal = (rule.menpo || []).includes(door);
  return {
    palace, door, star: STAR[codes.star], shen: SHEN[codes.shen],
    tian, di, doorCard, doorReal, tReal, dReal, codes
  };
}

// 一個干的狀態：牌面 / 真實
function stemStates(s, real){
  const cardState = s.state === 'normal' ? null : s.state; // 'rumu' | 'jixing'
  const realState = real.jixing ? 'jixing' : real.rumu ? 'rumu' : null;
  return { cardState, realState };
}
const STATE_NAME = { rumu:'入墓', jixing:'擊刑' };

let lastResult = null;
const $ = id => document.getElementById(id);

function cellHtml(text, o={}){
  const cls = ['cell'];
  if(o.red) cls.push('red'); if(o.orange) cls.push('orange'); if(o.cyan) cls.push('cyan'); if(o.shen) cls.push('shen');
  if(o.empty) return `<div class="${cls.join(' ')}"><span class="val"><span class="empty-circle"></span></span></div>`;
  return `<div class="${cls.join(' ')}"><span class="val">${text}</span></div>`;
}

function buildChart(){
  const codes = {};
  let bad = null;
  for(const c of CATS){
    const v = $('num_'+c.key).value.trim();
    if(v === ''){ if(c.optional) continue; bad = bad || `請填入「${c.name}」`; $('row_'+c.key).classList.add('bad'); continue; }
    const n = Number(v);
    if(!c.opts.some(o => o.code === n)){ bad = bad || `「${c.name}」的編號 ${v} 不存在`; $('row_'+c.key).classList.add('bad'); continue; }
    codes[c.key] = n;
  }
  if(bad){ $('rerollNote').textContent = bad; return; }
  $('rerollNote').textContent = '';

  const r = compute(codes);
  const tS = stemStates(r.tian, r.tReal), dS = stemStates(r.di, r.dReal);
  r.tS = tS; r.dS = dS;
  lastResult = r;

  const meta = palaceMeta[r.palace], halo = meta.halo;
  $('palaceFrameOuter').style.boxShadow = `0 0 36px 6px ${halo}`;
  $('palaceFrame').style.borderColor = halo;
  $('palaceFrame').style.boxShadow = `inset 0 0 30px ${halo}`;
  $('palaceGuaTop').style.color = halo; $('palaceGuaTop').style.textShadow = `0 0 18px ${halo}`;
  $('palaceName').style.color = halo; $('palaceName').style.textShadow = `0 0 14px ${halo}`;
  $('palaceGuaTop').textContent = meta.gua;
  $('palaceName').textContent = r.palace.split('').join(' ') + ' 宮';

  // 顏色：牌面或真實任一有，就標示（擊刑優先於入墓；兩者衝突時以牌面為準）
  const stemColor = st => { const s = st.cardState || st.realState; return { orange: s === 'jixing', cyan: s === 'rumu' }; };
  $('palaceGrid').innerHTML = `
    ${cellHtml(r.shen, {shen:true})}
    ${cellHtml(r.tian.value, Object.assign({empty:r.tian.empty}, stemColor(tS)))}
    ${cellHtml(r.star)}
    ${cellHtml(r.di.value, Object.assign({empty:r.di.empty}, stemColor(dS)))}
    ${cellHtml(r.door + '門', {red: r.doorCard || r.doorReal})}`;

  // 標籤與比對說明
  const tags = [], notes = [], harmForAI = [];
  const mark = (label, cardHas, realHas, cls) => {
    if(cardHas && realHas){ tags.push(`<span class="tag ${cls}">${label}（牌面＋真實）</span>`); notes.push(`<b>${label}</b>：牌面與真實奇門規則一致。`); harmForAI.push(`${label}（牌面抽到，且符合真實奇門規則）`); }
    else if(cardHas){ tags.push(`<span class="tag ${cls}">${label}（牌面）</span>`); notes.push(`<b>${label}</b>：這是抽牌抽到的狀態；依真實奇門規則，此宮此組合並不構成。`); harmForAI.push(`${label}（僅牌面抽到，真實奇門規則未構成）`); }
    else if(realHas){ tags.push(`<span class="tag warn">${label}（真實盤顯現）</span>`); notes.push(`<b>${label}</b>：牌面沒抽到，但這組宮、門、干在真實奇門中成立，四害實際存在。`); harmForAI.push(`${label}（牌面未抽到，但真實奇門規則成立）`); }
  };
  mark(`門迫：${r.door}門`, r.doorCard, r.doorReal, 'red');

  const stemMark = (pos, s, st) => {
    if(s.empty){ tags.push(`<span class="tag">${pos}空無</span>`); harmForAI.push(`${pos}空無`); return; }
    const c = st.cardState, rl = st.realState;
    if(c && rl && c === rl) mark(`${pos}${STATE_NAME[c]}：${s.value}`, true, true, c==='jixing'?'orange':'cyan');
    else {
      if(c) mark(`${pos}${STATE_NAME[c]}：${s.value}`, true, false, c==='jixing'?'orange':'cyan');
      if(rl) mark(`${pos}${STATE_NAME[rl]}：${s.value}`, false, true, rl==='jixing'?'orange':'cyan');
    }
  };
  stemMark('天干', r.tian, tS);
  stemMark('地干', r.di, dS);

  $('harmTags').innerHTML = tags.join('');
  const cmp = $('compareBox');
  if(notes.length){ cmp.innerHTML = notes.join('<br>'); cmp.classList.add('show'); } else { cmp.classList.remove('show'); cmp.innerHTML = ''; }
  r.harmForAI = harmForAI;

  const harmPlain = harmForAI.length ? harmForAI.join('　') : '牌面無四害，真實盤亦無四害';
  $('panSummary').innerHTML = `
    <span class="label">盤　象</span>
    <span class="line">${r.palace}宮・${r.shen}・${r.star}・${r.door}門</span>
    <span class="line">天干 ${r.tian.value}　地干 ${r.di.value}</span>
    <span class="line" style="color:var(--ink-faint); font-size:12px;">${harmPlain}</span>`;

  // 引導、覺察、神諭
  const g = GAME_GUIDE.find(x => x.no === codes.guide);
  const a = GAME_AWARE.find(x => x.no === codes.aware);
  const oTitle = codes.oracle ? GAME_ORACLE[codes.oracle - 1] : null;
  r.extra = {
    guide: { no: g.no, name: g.name, desc: g.desc, question: g.q },
    aware: { no: a.no, topic: a.topic, question: a.q },
    oracle: oTitle ? { no: codes.oracle, title: oTitle } : null
  };
  $('extraCards').innerHTML = `
    <div class="line">引導：${g.no}　${escapeHtml(g.name)}</div>
    <div>${escapeHtml(g.desc)}</div>
    <div class="line" style="margin-top:8px">覺察：${a.no}　${escapeHtml(a.topic)}</div>
    ${oTitle ? `<div class="line" style="margin-top:8px">神諭：${codes.oracle}　${escapeHtml(oTitle)}</div>` : ''}`;

  $('resultArea').classList.add('show');
  $('interpretBox').classList.remove('show'); $('interpretBox').textContent = '';
}
$('actionBtn').addEventListener('click', buildChart);
restorePending();

// ---------- AI 解盤 ----------
$('interpretBtn').addEventListener('click', async () => {
  if(!lastResult) return;
  const r = lastResult;
  const q = $('questionInput').value.trim();
  const stem = (s, st) => ({ value: s.value, empty: s.empty, cardState: st.cardState, realState: st.realState });
  const pan = {
    palace: r.palace, shen: r.shen, star: r.star, door: r.door,
    tianGan: r.tian.value, diGan: r.di.value,
    doorCard: r.doorCard, doorReal: r.doorReal,
    tian: stem(r.tian, r.tS), di: stem(r.di, r.dS),
    harmSummary: r.harmForAI,
    // 與一般模式相容的欄位（真實奇門判定）
    doorHarm: r.doorCard || r.doorReal,
    tianJixing: (r.tS.cardState || r.tS.realState) === 'jixing',
    diJixing: (r.dS.cardState || r.dS.realState) === 'jixing',
    tianRumu: (r.tS.cardState || r.tS.realState) === 'rumu',
    diRumu: (r.dS.cardState || r.dS.realState) === 'rumu',
    tianEmpty: r.tian.empty, diEmpty: r.di.empty
  };
  const box = $('interpretBox'), btn = $('interpretBtn');
  box.classList.add('show'); box.textContent = '解盤中，請稍候……'; btn.disabled = true;
  try{
    const resp = await fetch('/api/interpret', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ mode:'game', question:q, pan, cards:r.extra })
    });
    const data = await resp.json();
    if(!resp.ok){
      if(data.code === 'not_logged_in') box.textContent = '請先使用 LINE 登入，才能使用 AI 解盤。';
      else if(data.code === 'insufficient_points') box.textContent = '免費次數已用完，點數不足（目前 ' + (data.pointsBalance ?? 0) + ' 點），請儲值後再使用。';
      else box.textContent = '解盤失敗：' + (data.error || '請稍後再試');
    } else {
      box.textContent = data.interpretation + '\n\n' + (data.usedFree ? '（本次為免費使用）' : '（本次已扣 10 點）');
      refreshLoginState();
    }
  } catch(e){ box.textContent = '連線發生問題，請確認網路後再試一次。'; }
  finally{ btn.disabled = false; }
});
</script>
